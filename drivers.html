<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Робота водієм — TaxiGo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стилі спеціально для цієї сторінки, щоб нічого не зникло */
        body { margin: 0; font-family: sans-serif; background-color: #f4f4f4; color: #333; }
        
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .form-section {
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            margin-top: -50px; /* Наплив на шапку для стилю */
        }

        .driver-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
        }

        .input-box { margin-bottom: 20px; }
        .input-box label { display: block; margin-bottom: 8px; font-weight: bold; color: #1a1a1a; }
        .input-box input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
        }

        .yellow-btn {
            background: #ffe600;
            color: #1a1a1a;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .yellow-btn:hover { background: #e6ce00; transform: translateY(-2px); }
        .back-btn { color: white; text-decoration: none; margin-top: 20px; border-bottom: 1px dashed white; }
    </style>
</head>
<body>

    <header class="hero-section">
        <h1 style="font-size: 3rem; margin: 0;">Стань водієм TaxiGo</h1>
        <p style="font-size: 1.2rem; margin: 10px 0;">Заробляй на власному авто у зручний час</p>
        <a href="index.html" class="back-btn">← На головну</a>
    </header>

    <section class="form-section">
        <div class="driver-card">
            <h2 style="text-align: center; margin-top: 0; color: #1a1a1a;">Анкета для реєстрації</h2>
            <form>
                <div class="input-box">
                    <label>Ваше ім'я</label>
                    <input type="text" placeholder="Наприклад: Олександр" required>
                </div>
                <div class="input-box">
                    <label>Ваш автомобіль</label>
                    <input type="text" placeholder="VW Golf 4, Hyundai і т.д." required>
                </div>
                <div class="input-box">
                    <label>Номер телефону</label>
                    <input type="tel" placeholder="+380..." required>
                </div>
                <button type="submit" class="yellow-btn">Відправити заявку</button>
            </form>
        </div>
    </section>

</body>
</html>
