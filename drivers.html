<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Стати водієм — TaxiGo</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #ffffff !important; }
        .hero { 
            background: #1a1a1a; 
            color: white; 
            padding: 60px 20px; 
            text-align: center; 
        }
        .form-section { 
            display: flex; 
            justify-content: center; 
            padding: 40px 20px; 
            background-color: #ffffff; 
        }
        /* ЦЯ КАРТКА БУДЕ ВИДИМОЮ ЗАВЖДИ */
        .driver-card { 
            background: #ffffff !important; 
            color: #1a1a1a !important; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
            width: 100%; 
            max-width: 450px; 
            border: 2px solid #ffcc00; 
        }
        .input-box { margin-bottom: 15px; text-align: left; }
        .input-box label { display: block; font-weight: bold; margin-bottom: 5px; color: #1a1a1a !important; }
        .input-box input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            background: #fff !important;
            color: #000 !important;
        }
        .yellow-btn { 
            background: #ffcc00; 
            color: #1a1a1a; 
            border: none; 
            width: 100%; 
            padding: 15px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px;
        }
    </style>
</head>
<body>
    <header class="hero">
        <h1>Стань водієм TaxiGo</h1>
        <p>Заробляй на власному авто</p>
        <a href="index.html" style="color: #ffcc00; text-decoration: none;">← На головну</a>
    </header>

    <section class="form-section">
        <div class="driver-card">
            <h2 style="text-align: center;">Анкета водія</h2>
            <form>
                <div class="input-box">
                    <label>Ваше ім'я</label>
                    <input type="text" placeholder="Олександр" required>
                </div>
                <div class="input-box">
                    <label>Автомобіль</label>
                    <input type="text" placeholder="Марка та модель" required>
                </div>
                <div class="input-box">
                    <label>Телефон</label>
                    <input type="tel" placeholder="+380..." required>
                </div>
                <button type="submit" class="yellow-btn">ВІДПРАВИТИ</button>
            </form>
        </div>
    </section>
</body>
</html>
